# One entry per tool. The geopick package builds both README tables from this
# file. The rung a plan reaches is computed from the three booleans, never
# typed, so a table cell cannot drift from the facts underneath it.
#
# Rungs, in order. A plan stops at the highest one it reaches.
#   report          it shows where you are missing
#   recommendation  it says which page to change or which source to pitch
#   draft           it writes the content for you
#   published       it pushes the page live in your CMS
#
# entry is the cheapest paid plan (or the trial when nothing is sold self
# serve). top is the highest rung the vendor sells on any plan, with the
# cheapest plan that reaches it. price is a number when published, null when
# quoted by sales. engines_included is the number of AI engines the entry
# plan tracks at once, as an integer the CLI can filter on.
#
# Facts come from the AIclicks roundup (vendor pages checked November 2026)
# plus aiclicks.io/pricing and promptwatch.com/pricing, both read on
# 12 November 2026. Plans change often. Confirm before you buy.

- id: aiclicks
  name: AIclicks
  url: https://aiclicks.io
  entry:
    plan: Starter
    price: 59
    unit: /mo
    engines: 3, you pick
    engines_included: 3
    recommends: true
    drafts: true
    publishes: false
  top:
    plan: Starter
    price: 59
    recommends: true
    drafts: true
    publishes: false
  trial: 3 days, card required
  note: 30 prompts, 5 articles a month, CMS integration listed on every plan


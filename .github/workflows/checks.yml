name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CLIENT_DOMAIN: aiclicks.io

jobs:
  table:
    name: Generated tables match tools.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python render_table.py --check

  links:
    name: Links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check client and github.com links
        run: |
          fail=0
          for url in $(grep -oh "https://\(\([a-z]*\.\)\?$CLIENT_DOMAIN\|github\.com\)[^)\"< ]*" README.md | sed 's/[.,]$//' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "$url" || echo 000)
            if [ "$code" != "200" ]; then echo "  $code  $url"; fail=1; fi
          done
          exit $fail
